services:
  mysql:
    image: mysql:8.4
    container_name: mysql-composite-index-order-lab
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: index_lab
      TZ: UTC
    network_mode: none
    command:
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=2
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
